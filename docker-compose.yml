services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changez_moi}
      POSTGRES_DB: ${POSTGRES_DB:-gep}
    ports:
      # Port hôte 5442 : le 5432 est déjà pris par un PostgreSQL natif installé
      # sur ce poste (service Windows postgresql-x64-16). Les autres conteneurs
      # (api) parlent à postgres via le réseau Docker interne sur le port 5432,
      # ce remap ne concerne que les outils externes (pgAdmin) connectés depuis
      # l'hôte.
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gep}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Port hôte 8010 : le 8000 est déjà pris par un autre projet sur ce poste.
      - "8010:8000"
    volumes:
      - ./backend:/app
      - donnees_justificatifs:/donnees/justificatifs
    healthcheck:
      # Port interne au conteneur (8000, celui d'uvicorn) : le remap 8010 n'existe
      # que côté hôte, /health reste hors du préfixe /api (voir main.py). Pas de
      # curl dans l'image : le Python déjà présent suffit.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Build de production (nginx + build statique). Exclu de `docker compose up` par
  # défaut : en développement le front tourne nativement (`npm run dev`, HMR),
  # ce service ne sert qu'à vérifier le build de prod. Voir README.
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: ["full"]
    env_file: .env
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  donnees_justificatifs:
